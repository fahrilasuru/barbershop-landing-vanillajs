<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Gentleman Barbershop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
</head>
<body>
    <header></header>

    <main>
        <!-- HERO -->
        <section class="hero">
            <div class="hero-content">
                <h1>Gentleman <span class="gold">Barbershop</span></h1>
                <p>Rasakan pengalaman barbershop eksklusif. Dari haircut hingga creambath, kami hadir untuk pria sejati.</p>
                <div class="hero-cta">
                    <button class="cta btn-booking">Booking sekarang</button>
                    <button class="cta btn-styles">Lihat Gaya</button>
                </div>
            </div>
            <div class="hero-image">
                <img src="images/illustration.webp" alt="Barbershop illustration" />
            </div>
        </section>

        <!-- BARBERS -->
        <section>
            <h2>Master <span class="gold">Barber</span></h2>
            <p>Ahli dengan pengalaman bertahun-tahun</p>
            <div class="barber-grid"></div>
        </section>
    </main>

    <footer></footer>

    <template id="barber-card-template">
        <div class="barber-card">
            <img class="barber-avatar" alt="" data-bind="avatar" />
            <div class="barber-name" data-bind="name"></div>
            <div class="barber-role" data-bind="role"></div>
            <div class="barber-rating" data-bind="rating"></div>
        </div>
    </template>

    <script type="module" src="js/main.js"></script>
</body>
</html>
